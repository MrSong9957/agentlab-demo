# 026：提交前密钥扫描配置（gitleaks protect --staged 使用）
# 扩展官方默认规则（AWS/GitHub/PEM 等），另加本项目 DeepSeek 密钥形态。
[extend]
useDefault = true

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API Key (sk- + 32 hex)"
regex = '''sk-[a-f0-9]{32}'''
keywords = ["sk-"]

# 值锚定豁免（2026-10-26 交付时由旧 [allowlist] 转为 [[allowlists]]，语义不变：
# gitleaks 8.30 禁止两种形式共存）：仅放行 2026-10-21 逐条核查过的固定测试
# 样例（纯顺序字符假值，见 docs/records/2026-10-21-github-sanitization.md 表）。
# 同一路径出现其他疑似密钥不匹配这些值，仍会被拦截。
[[allowlists]]
description = "verified test fixtures (2026-10-21 audit)"
regexes = [
  '''sk-ABCDEFGHIJKLMNOPQRSTUVwx123''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''Bearer abcdefghijklmnop''',
]

# 交付豁免（2026-10-26，用户批准的限定例外）：路径＋内容双锚定（conditions=AND），
# 核查与四向验证记录见 docs/logs/026-pre-commit-secret-scan/2026-10-26-delivery-exemptions.md。
# 不放宽其他任何文件、值或规则；未采用任意十六进制模式/PEM 头/整文件放行。
[[allowlists]]
description = "perf evidence: three source SHA-256 benchmark fingerprints (verified false positives)"
paths = ['''^docs/logs/024-native-model-apis/performance-final-025\.json$''']
regexTarget = "line"
regexes = [
  '''"src/app/src/api\.rs": "68ecaba4069a0208f18e99c8e2c20172cc39e70a2904c33bda40bb2ac8b8eb92"''',
  '''"src/app/src/mcp/secrets\.rs": "9c81ae7ec578bfd81d6ce01d281b0009c61914cbdb5c3488dccb2405b4f6ba36"''',
  '''"src/app/src/memory/secrets\.rs": "1577d9a88711dba90be0c0e1338c471d37b820d8a8d1239a0cfd58e3d463bd26"''',
]
rules = ["generic-api-key"]
condition = "and"

