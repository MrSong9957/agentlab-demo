# agentlab-demo 开发容器
# 环境变量决定程序往哪里写；volume 决定容器重建后数据还在不在。
name: agentlab-demo

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: agentlab-demo-dev:latest
    container_name: agentlab-demo-dev
    user: dev
    working_dir: /workspace
    # 033：seccomp 放宽 profile——由执行 docker 的 CLI（compose）在宿主侧读取
    # 该路径的文件内容、经 API 下发给引擎；引擎不读宿主文件系统（放行 bwrap
    # 所需的 userns/mount syscall 集合；基线按引擎 docker-v29.8.2 →
    # moby/profiles/seccomp 锁定生成，见 docs/logs/033-tool-sandbox/2026-10-27-dev-deploy.md）。
    # 路径为宿主（CLI）视角绝对路径、D:/ 盘符正斜杠（docker.exe 接受且不被
    # MSYS 转换，2026-10-27 实测）；引擎版本变化时须重新生成基线，不得沿用
    # （deploy-033-host.sh 有版本守卫）。
    security_opt:
      - seccomp=D:/AgentLab/projects/demo/.devcontainer/033-seccomp.json
    command: sleep infinity
    # 交互式会话分配 TTY；TERM 给缺省值（exec 会话自动继承），
    # 需要与本机终端严格一致时可在 exec 加 -e TERM="$TERM" 覆盖
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      # 容器程序统一走 Windows 宿主机 FlClash（仅系统代理，混合端口 7890）。
      # host.docker.internal 由 Docker Desktop 解析到宿主机（IPv4 192.168.65.254）。
      # 2026-10-18 验证：CONNECT 隧道建立、api.github.com 返回 HTTP 200。
      # 重建容器（up -d）后生效；当前容器的存量 shell 需重建或见 ~/.bashrc 导出块。
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      http_proxy: http://host.docker.internal:7890
      https_proxy: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal
      # Agent 配置目录（写入持久卷）
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      CODEX_HOME: /home/dev/.codex
      # 下载缓存（可清理，容器重建后仍在卷里）
      npm_config_cache: /cache/npm
      npm_config_store_dir: /cache/pnpm/store
      npm_config_cache_dir: /cache/pnpm/cache
      PLAYWRIGHT_BROWSERS_PATH: /cache/playwright
      # Cargo（持久卷，不能整卷删除）
      CARGO_HOME: /home/dev/.cargo
      CARGO_TARGET_DIR: /workspace/target
      # 033 工具沙箱：非空即启用（置空回普通模式）。会被 cargo test 继承；
      # 三型沙箱测试用例内部自控开关、不受外部值影响，普通模式回归/全量
      # 测试（3506/0/3 基线）须单独 env -u TCHAT_SANDBOX 清除后运行。
      TCHAT_SANDBOX: "1"
    volumes:
      # 项目源码
      - type: bind
        source: ..
        target: /workspace
        bind:
          create_host_path: false
      # 共享知识库（Windows 只保留这一份）
      - type: bind
        source: D:/AgentLab/shared/Obsidian
        target: /vault
        read_only: false
        bind:
          create_host_path: false
      # Agent 配置长期数据
      - type: volume
        source: zcode-home
        target: /home/dev/.zcode
      - type: volume
        source: claude-home
        target: /home/dev/.claude
      - type: volume
        source: codex-home
        target: /home/dev/.codex
      # 项目目录已绑定到宿主；数据预先迁入此处，重建时直接使用，不再另行导入空卷。
      - type: bind
        source: ../.container-state/pi
        target: /home/dev/.pi
        bind:
          create_host_path: false
      - type: bind
        source: ../.container-state/cc-switch
        target: /home/dev/.cc-switch
        bind:
          create_host_path: false
      - type: volume
        source: cargo-home
        target: /home/dev/.cargo
      # 可清理缓存
      - type: volume
        source: cache
        target: /cache

volumes:
  zcode-home:
  claude-home:
  codex-home:
  cargo-home:
  cache:
