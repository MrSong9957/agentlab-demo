# 038：三平台 CI——复用仓库既有全量验证入口（AGENTS.md §8「全量验证」）：
#   cargo check && cargo test --workspace --no-fail-fast
# 按 §6 可复现性规则补 --locked（锁定 Cargo.lock，不改测试集合）。
# 平台差异处理：
#   - Linux 安装 bubblewrap，沙箱族测试（031/033）可真实执行；
#   - Windows/macOS 无 bubblewrap（Linux 专属技术）、PTY 测试经 posix_openpt 实现
#     （POSIX 语义），相关用例在源码以 cfg 门控排除——排除清单与原因见
#     docs/specs/038-github-actions-ci.md；除门控外不删减、不改写任何测试。
name: CI

# 触发去重（同一验证目标只跑一次）：push 仅主分支（分支上的推送由该分支的
# PR synchronize 事件覆盖，避免 push＋PR 双跑）；PR 与手动触发各自生效。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      # 一端失败不取消其余平台，保证三端结果完整可见。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 上限防挂起运行：macOS 冷缓存构建＋全量实测约 95 分钟（第 7 轮 90 分钟被截断），放宽到 150。
    timeout-minutes: 150
    # Windows/macOS：均为产品级移植项，非 CI 配置问题——
    #   Windows：lib 的 POSIX 进程语义层（killpg 组杀/pid_t/进程组整批回收/
    #   pre_exec）无 Windows 等价实现（016 组杀契约依赖进程组），62 处编译缺口
    #   （第 4 轮实证），需 Job Objects 级重设计；
    #   macOS：可编译且大部分通过，但 /proc/self/fd 写回（internal-apply）、
    #   AGENTS.md 链发现、符号链接竞态语义、e2e PTY 卡死为产品级缺口
    #   （第 8 轮实证，45 处失败＋1 处卡死）。
    # 标记 continue-on-error：结果可见、不阻塞 ubuntu 信号；移植属产品级后续
    # 工作（见 docs/specs/038-github-actions-ci.md §5）。
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    env:
      # 采样开关＝项目既有机器口径机制（032/034 原生、031 按同款约定补齐）：
      # CI 托管机器不可重新冻结，按模块设计跳过冻结阈值断言、场景照跑；
      # 各预算的实际通过环境记录于 docs/specs/038-github-actions-ci.md §8。
      JS34_PERF_SAMPLE: "1"
      TCHAT_CM32_PERF_SAMPLE: "1"
      TCHAT_P31_PERF_SAMPLE: "1"
      # runner 磁盘 14GB：debug 产物含全量 debuginfo 本地实测 26GB，链接期
      # SIGBUS（首轮 ubuntu 实证）——CI 去 debuginfo（panic 位置信息来自宏，
      # 不受影响）并关闭增量缓存（rust-cache 官方建议）。
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      # Windows 检出保持 LF（仓库 .gitattributes 为 * text=auto；runner 默认
      # autocrlf 行为不作依赖），避免行结尾差异污染文本断言。
      - name: Windows 检出行结尾归一（LF）
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 沙箱探测按 PATH 查找 bwrap 并真实干跑（sandbox::probe_bwrap）；GitHub
      # 托管 Ubuntu 镜像未预装二者——bubblewrap 覆盖沙箱族测试，ripgrep 为
      # 记忆检索（013-M6）的生产依赖，缺失时 memory_inject/memory_lifecycle
      # 的 M6 验收按设计失败。
      - name: 安装 bubblewrap 与 ripgrep（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap ripgrep
      # macOS 镜像可能自带 ripgrep，显式安装保证确定性（已装则秒回）。
      - name: 安装 ripgrep（macOS）
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: 安装 ripgrep（Windows）
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - name: cargo check
        run: cargo check --locked
      - name: cargo test（全量：单元＋集成＋回归＋E2E）
        run: cargo test --workspace --no-fail-fast --locked

  # D1–D3 runner 异常诊断（docs/logs/038-github-actions-ci/2026-10-31-runner-diagnosis-plan.md
  # 的机械翻译）：非门禁——仅手动触发时与主验证并行运行，只采集证据工件供根因
  # 分析，不改变 CI 结论。D1＝seccomp 生效性（attack06：clone3 应 ENOSYS 实测
  # EINVAL）；D2＝沙箱进程树回收（c13/e_reaping：close 后成员存活超 poll 窗口）；
  # D3＝沙箱内 MCP 服务器（b2_mcp：fd 缺失→tools=0）。
  runner-diagnosis:
    name: runner-diagnosis (D1-D3)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装诊断依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap strace gcc
      - name: 环境取证
        run: |
          {
            echo "== 版本 =="; bwrap --version; uname -srvo
            echo "== userns/bpf sysctl =="
            for k in kernel.unprivileged_userns_clone user.max_user_namespaces kernel.unprivileged_bpf_disabled; do
              sysctl "$k" 2>/dev/null || echo "$k: (不可读)"
            done
            echo "== userns 干跑 =="
            unshare --user --map-root-user echo userns-ok || echo "userns-FAIL"
          } | tee diagnosis-env.txt
      - name: D1 seccomp 生效性（最小复现：产品同款 cBPF 字节，不经产品进程链）
        run: |
          gcc -x c - -o /tmp/probe <<'EOF'
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          int main(void) {
              long r = syscall(437, NULL, 0); /* clone3 */
              printf("clone3_ret=%ld errno=%d (%s)\n", r, errno, strerror(errno));
              return 0;
          }
          EOF
          python3 - <<'PY'
          import struct
          # 复刻 sandbox::build_seccomp_filter（字节一致）：arch 门→EPERM 清单→
          # ENOSYS 清单→clone 命名空间掩码→ALLOW
          EPERM=[101,155,165,166,167,168,169,175,176,246,272,300,303,304,308,310,311,313,320,321,323,328,428,429,430,431,432]
          def insn(code,jt,jf,k): return struct.pack('<HBBI',code,jt,jf,k)
          prog  = insn(0x20,0,0,4) + insn(0x15,1,0,0xC000003E) + insn(0x06,0,0,0x00080000)
          prog += insn(0x20,0,0,0)
          for nr in EPERM: prog += insn(0x15,0,1,nr) + insn(0x06,0,0,0x00050000|1)
          prog += insn(0x15,0,1,437) + insn(0x06,0,0,0x00050000|38)
          prog += insn(0x15,0,4,56) + insn(0x20,0,0,16) + insn(0x54,0,0,0x7E020000) + insn(0x15,1,0,0)
          prog += insn(0x06,0,0,0x00050000|1) + insn(0x06,0,0,0x7FFF0000)
          open('/tmp/filter.bpf','wb').write(prog)
          print("filter bytes:", len(prog))
          PY
          {
            echo "== 带 --seccomp（期望 clone3 errno=38 ENOSYS）=="
            bwrap --ro-bind / / --unshare-user --unshare-ipc --cap-drop ALL --dev-bind /dev /dev --seccomp 3 3</tmp/filter.bpf -- /tmp/probe || echo "(exit=$?)"
            echo "== 不带 --seccomp 对照（期望 errno=22 EINVAL）=="
            bwrap --ro-bind / / --unshare-user --unshare-ipc --cap-drop ALL --dev-bind /dev /dev -- /tmp/probe || echo "(exit=$?)"
            echo "== strace：bwrap 是否调用 seccomp(SET_MODE_FILTER)＝加载侧取证 =="
            strace -f -e trace=seccomp,memfd_create,close_range -o /tmp/strace.txt \
              bwrap --ro-bind / / --unshare-user --unshare-ipc --cap-drop ALL --dev-bind /dev /dev --seccomp 3 3</tmp/filter.bpf -- /tmp/probe || true
            grep -E "seccomp|memfd|close_range" /tmp/strace.txt | head -40 || true
          } | tee d1-seccomp.txt
      - name: D2/D3 失败用例复跑＋进程树采样
        run: |
          : > ps-samples.txt
          (while true; do
            echo "--- $(date +%s.%N)" >> ps-samples.txt
            ps -eo pid,ppid,pgid,sid,stat,comm --no-headers | grep -E "bwrap|sleep|python3" >> ps-samples.txt || true
            for p in $(pgrep -x sleep); do grep NSpid /proc/"$p"/status 2>/dev/null >> ps-samples.txt || true; done
            sleep 0.2
          done) &
          SAMPLER=$!
          cargo test --locked -p terminal-chat --no-fail-fast \
            --test security_attack_031 --test sandbox_matrix_probes --test multi_agent \
            2>&1 | tee d2d3-tests.log
          kill "$SAMPLER" 2>/dev/null || true
          echo "== 失败用例的证据行（before/after_close、FDSCAN、marker_pid）==" | tee d2d3-evidence.txt
          grep -E "before_close|after_close|FDSCAN|marker_pid|leftover" d2d3-tests.log | head -40 | tee -a d2d3-evidence.txt || true
      - name: D1 产品启动链对证（strace 产品的 bwrap 启动＋argv 全量转储）
        run: |
          # 最小产品链复现：attack06 同路径——经产品 entry 构造 031 沙箱启动
          # （write_policy＋policy_from_env＋真实 exec_command 沙箱面），strace
          # 捕获 bwrap 的 seccomp/memfd/close_range 调用与完整 argv。
          gcc -x c - -o /tmp/probe2 <<'EOF'
          #include <stdio.h>
          #include <errno.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          int main(void) {
              long r = syscall(437, NULL, 0);
              printf("clone3_ret=%ld errno=%d (%s)\n", r, errno, strerror(errno));
              return 0;
          }
          EOF
          {
            echo "== 产品的 bwrap 启动链（policy_from_env → build_tool_command）=="
            strace -f -e trace=seccomp,memfd_create,close_range,execve -o /tmp/strace-product.txt \
              cargo test --locked -p terminal-chat --test security_attack_031 attack06_seccomp_allows_toolchain_blocks_privileged_syscalls -- --exact --nocapture 2>&1 | tail -20
            echo "== bwrap argv（来自 strace execve 行）=="
            grep -E "execve.*bwrap" /tmp/strace-product.txt | head -3
            echo "== seccomp/memfd/close_range 调用序列 =="
            grep -E "seccomp|memfd_create|close_range" /tmp/strace-product.txt | head -30
          } | tee d1-product-chain.txt || true
      - name: 上传诊断工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnosis
          path: |
            diagnosis-env.txt
            d1-product-chain.txt
            d1-seccomp.txt
            d2d3-tests.log
            d2d3-evidence.txt
            ps-samples.txt
