# 038：三平台 CI——复用仓库既有全量验证入口（AGENTS.md §8「全量验证」）：
#   cargo check && cargo test --workspace --no-fail-fast
# 按 §6 可复现性规则补 --locked（锁定 Cargo.lock，不改测试集合）。
# 平台差异处理：
#   - Linux 安装 bubblewrap，沙箱族测试（031/033）可真实执行；
#   - Windows/macOS 无 bubblewrap（Linux 专属技术）、PTY 测试经 posix_openpt 实现
#     （POSIX 语义），相关用例在源码以 cfg 门控排除——排除清单与原因见
#     docs/specs/038-github-actions-ci.md；除门控外不删减、不改写任何测试。
name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      # 一端失败不取消其余平台，保证三端结果完整可见。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 本地全量约 12–20 分钟；CI 冷缓存构建翻倍，上限防挂起运行。
    timeout-minutes: 90
    steps:
      # Windows 检出保持 LF（仓库 .gitattributes 为 * text=auto；runner 默认
      # autocrlf 行为不作依赖），避免行结尾差异污染文本断言。
      - name: Windows 检出行结尾归一（LF）
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 沙箱探测按 PATH 查找 bwrap 并真实干跑（sandbox::probe_bwrap）；
      # GitHub 托管 Ubuntu 镜像未预装 bubblewrap，显式安装以覆盖沙箱族测试。
      - name: 安装 bubblewrap（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: cargo check
        run: cargo check --locked
      - name: cargo test（全量：单元＋集成＋回归＋E2E）
        # JS34_PERF_SAMPLE：034 性能冻结阈值为校准机器口径（docs/logs/034-javascript-tool-orchestration/
        # 2026-10-29-perf-freeze.md，「机器或构建变化须重新冻结」）——CI 托管机器临时且性能
        # 不可比，无法重新冻结；按该模块设计的采样模式执行全部场景（预热/正式/轮次不变）
        # 并跳过阈值断言，阈值门禁仍在本机容器全量验证中生效。
        env:
          JS34_PERF_SAMPLE: "1"
        run: cargo test --workspace --no-fail-fast --locked
