# 本地最小 shim（008 §3-J5 适配定稿）：仅为 tchat-tui vendored 文件提供 `use codex_utils_path::…` 路径。
# 内容＝保留文件实际消费的母本类型最小子集，逐类型登记于 src/lib.rs 注释。
# 不是 openai/codex 对应 crate 的 vendor。
[package]
name = "codex-utils-path"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "codex_utils_path"
path = "src/lib.rs"
doctest = false

[dependencies]
dunce = "1"

# 038-CI：system_commands.rs 的 cfg(windows) 分支（SHGetKnownFolderPath 已知
# 目录解析＋CoTaskMemFree 释放）依赖此前未声明，Windows 首次编译即失败——补齐。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
