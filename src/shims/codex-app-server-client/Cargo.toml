# 本地最小 shim（008 §3-J5 适配定稿）：仅为 tchat-tui vendored 文件提供 `use codex_app_server_client::…` 路径。
# 内容＝保留文件实际消费的母本类型最小子集，逐类型登记于 src/lib.rs 注释。
# 不是 openai/codex 对应 crate 的 vendor。
[package]
name = "codex-app-server-client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "codex_app_server_client"
path = "src/lib.rs"
doctest = false

[dependencies]
codex-config = { path = "../codex-config" }
codex-protocol = { path = "../codex-protocol" }
codex-utils-absolute-path = { path = "../codex-utils-absolute-path" }
