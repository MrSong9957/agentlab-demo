[package]
name = "terminal-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
diffy = "0.4"  # 012：apply_patch 展示差异（真实前后内容的统一 diff；与 tchat-tui 同锁版本）
bm25 = "2.3.2"  # 030：tool_search 本地词法检索（MIT；与上游 codex@d138398 同版本；English 默认词法、按语料拟合）
libc = "0.2"
rustyline = { version = "18", default-features = false, features = ["buffer-redux"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "2", features = ["json"] }
url = "2.5.8"

tchat-tui = { path = "../tui" }  # 008-P3：真实接入恢复
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex-lite = "0.1"  # 013-M3 D7：redact_secrets 移植（工作区已锁版本，tui 同款；regex 兼容性由移植测试证明）
codex-protocol = { path = "../shims/codex-protocol" }  # 017：update_plan 参数三类型共用（后端解析与 TUI 计划 cell 同源）
codex-utils-string = { path = "../shims/codex-utils-string" }  # 013-M3 D11：截断/近似换算复用 008 shim（上游同文件逐字节）
chrono = { version = "0.4", default-features = false, features = ["std"] } # 013-M4：复用锁定版本，固定 UTC 格式
uuid = { version = "1", default-features = false } # 013-M4：上游文件名的 UUID 解析/时间戳；不生成随机 UUID
base64 = "0.22"  # 019：view_image data URL 编解码（工作区已锁 0.22.1，与 tui 同款）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }  # 019：图片解码/缩放/编码（上游 codex-utils-image 函数级移植；特性沿用 tui）
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "98a54789b80110ad210495c4ad845c89e1980471", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }  # 022：官方 MCP SDK 固定 rev（rmcp 3.5.1，Apache-2.0）；仅客户端＋stdio/Streamable HTTP，规格 §3.1
futures = "0.3"  # 022：SDK HTTP 适配器移植所需的 Stream 工具（工作区已锁版本）
http = "1"  # 022：env_http_headers 的 HeaderName/HeaderValue（rmcp 同源）
bytes = "1"  # 022：SSE 字节流限额器（rmcp 同源）
sse-stream = "0.2"  # 022：SSE 事件流解析（rmcp 同源）
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }  # 022：有界 HTTP 客户端移植（与 rmcp 的 reqwest 依赖同版本合并）；022 §5.4：官方 rustls 组合（aws-lc-rs＋platform-verifier 系统根）使远程 HTTPS 可用；0.13 已无 webpki-roots 直选 feature，与 ureq（ring/webpki）为两个独立 TLS 栈

[dev-dependencies]
# 022 §5.4：TLS mock 服务器（自签证书）；与 reqwest 传递的 rustls 同版本同 provider，避免双 provider。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
